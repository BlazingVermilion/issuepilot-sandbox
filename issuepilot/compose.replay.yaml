# Use the root demo.py for a clean checkout, or scripts/demo.py for the legacy replay instance.
services:
  n8n:
    healthcheck:
      # Wait for n8n's own database/migrations, not just the Docker process.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz/readiness', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  postgres:
    healthcheck:
      # Exercise the same password-authenticated TCP route used by the API, not a local socket.
      test: [CMD-SHELL, 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -X -w -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT 1" >/dev/null']
  api:
    environment: &replay
      IP_DATASET_REPLAY: "true"
      IP_MODE: demo
      IP_REPO: replay/issuepilot-sandbox
      IP_ENGINE: ollama
      IP_GITHUB_TOKEN: ""
      IP_WRITES_ENABLED: "false"
    volumes:
      - type: bind
        source: ${IP_REPLAY_DATA_DIR:-./data/replay}
        target: /app/data/replay
        read_only: true
      - ./artifacts/replay:/app/artifacts
  worker:
    environment: *replay
    volumes:
      - type: bind
        source: ${IP_REPLAY_DATA_DIR:-./data/replay}
        target: /app/data/replay
        read_only: true
  analytics:
    image: issuepilot-replay-analytics:0.5.4
    environment: *replay
    volumes:
      - ./artifacts/replay:/app/artifacts
