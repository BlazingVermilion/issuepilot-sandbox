# Use the root demo.py for a clean checkout, or scripts/demo.py for the legacy replay instance.
services:
  postgres:
    healthcheck:
      # Exercise the same password-authenticated TCP route used by the API, not a local socket.
      test: [CMD-SHELL, 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -X -w -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT 1" >/dev/null']
  api:
    environment: &replay
      IP_DATASET_REPLAY: "true"
      IP_MODE: demo
      IP_REPO: replay/issuepilot-sandbox
      IP_ENGINE: ollama
      IP_GITHUB_TOKEN: ""
      IP_WRITES_ENABLED: "false"
    volumes:
      - ./data/replay:/app/data/replay:ro
      - ./artifacts/replay:/app/artifacts
  worker:
    environment: *replay
    volumes:
      - ./data/replay:/app/data/replay:ro
  analytics:
    image: issuepilot-replay-analytics:0.5.3
    environment: *replay
    volumes:
      - ./artifacts/replay:/app/artifacts
