name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: issuepilot_test
          POSTGRES_USER: issuepilot
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U issuepilot -d issuepilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.6
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://issuepilot:test-only-password@localhost:5432/issuepilot_test
          TEST_CHECKPOINT_URL: postgresql://issuepilot:test-only-password@localhost:5432/issuepilot_test
      - run: uv run python scripts/evaluate.py --engine rules --out artifacts/evaluation-rules.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-rules
          path: artifacts/evaluation-rules.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/init_env.py
      - run: docker compose up -d --build --wait
      - run: curl --fail http://localhost:8000/health
      - run: docker compose down
        if: always()
