[project]
name = "issuepilot"
version = "0.3.0"
description = "Evidence-grounded GitHub issue triage with human approval"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
 "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "httpx[socks]>=0.28,<1",
 "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
 "langgraph-checkpoint-sqlite>=3,<4", "langchain-ollama>=1,<2",
 "rank-bm25>=0.2.2,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
snowflake = ["snowflake-connector-python>=3.15,<5"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.hatch.build.targets.wheel]
packages = ["src/issuepilot"]
