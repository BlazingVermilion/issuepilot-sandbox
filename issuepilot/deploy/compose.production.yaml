services:
  caddy:
    image: caddy:2.10.2-alpine
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the application DNS name}
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:?Set the webhook DNS name}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      n8n:
        condition: service_started
    restart: unless-stopped
  n8n:
    environment:
      N8N_SECURE_COOKIE: 'true'
      WEBHOOK_URL: https://${WEBHOOK_DOMAIN}/
      N8N_PROXY_HOPS: '1'
volumes:
  caddy_data:
  caddy_config:
