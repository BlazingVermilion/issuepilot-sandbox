name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    working-directory: issuepilot
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: issuepilot_test
          POSTGRES_USER: issuepilot
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U issuepilot -d issuepilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.6
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . ../manage.py ../demo.py && uv run ruff format --check . ../manage.py ../demo.py
      - run: uv run pytest -q
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://issuepilot:test-only-password@localhost:5432/issuepilot_test
          TEST_CHECKPOINT_URL: postgresql://issuepilot:test-only-password@localhost:5432/issuepilot_test
      - run: uv run python scripts/benchmark.py B1 --engine rules --out artifacts/benchmarks/b1
      - run: uv run python scripts/benchmark.py B2 --engine rules --out artifacts/benchmarks/b2
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-rules
          path: issuepilot/artifacts/benchmarks/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/init_env.py
      - run: IP_N8N_WORKFLOW_ID=ci-inbox IP_REPO=sandbox/issuepilot docker compose -f compose.yaml -f compose.intake.yaml --profile automation --profile analytics config --quiet
      - run: docker compose build api && docker compose up -d --no-build --wait
      - run: curl --fail http://localhost:8000/health
      - name: Verify bundled Qwen tokenizer without loading the LLM
        run: docker compose exec -T worker python -c "from issuepilot.ai.client import _tokenizer; assert _tokenizer('models/qwen3-tokenizer.json').encode('test').ids"
      - name: Start the clean-checkout dataset stack and verify empty intake
        working-directory: .
        run: |
          python manage.py start --workflow http://localhost:5678/workflow/ci-inbox
          python manage.py status > "$RUNNER_TEMP/intake-status.json"
          python -c "import json, os; from pathlib import Path; d=json.loads((Path(os.environ['RUNNER_TEMP'])/'intake-status.json').read_text()); assert d['expected']>0 and d['received']==0 and d['not_received']==d['expected']"
          curl --fail http://localhost:8021/health
          # The user's existing n8n is outside CI. The workspace must not provision another one.
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=issuepilot-workspace --filter label=com.docker.compose.service=n8n)"
      - name: Print intake diagnostics on failure
        if: failure()
        working-directory: .
        run: python manage.py logs
      - run: docker compose down
        if: always()
  ai-bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python bench.py doctor
      - run: python bench.py --dataset-config examples/local/profile.json check-data
      - run: python bench.py --dataset-config examples/local/profile.json classify --modes rules --out runs/ci-class
      - run: python bench.py --dataset-config examples/local/profile.json classify-report --out runs/ci-class
      - run: python bench.py --dataset-config examples/local/profile.json retrieval --modes bm25 --out runs/ci-retrieval
      - name: Build the held-out retrieval report (CPU, no model credentials)
        run: python bench.py retrieval --modes policy --split test --device cpu --out runs/held-out-policy
      - uses: actions/upload-artifact@v4
        with:
          name: policy-retrieval-test
          path: ai-bench/runs/held-out-policy/policy.json
          if-no-files-found: error
  windows-cli:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check first-run paths without creating a workspace or reading credentials
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'profile with spaces'
          $expected = Join-Path $env:LOCALAPPDATA 'IssuePilot/workspace/settings.env'
          $canonical = python .\manage.py settings-path
          if ($LASTEXITCODE -ne 0) { throw 'manage.py failed' }
          $compat = python .\demo.py settings-path
          if ($LASTEXITCODE -ne 0) { throw 'demo.py failed' }
          if ([IO.Path]::GetFullPath($canonical) -ne [IO.Path]::GetFullPath($expected)) { throw 'Unexpected settings location' }
          if ($canonical -ne $compat -or (Test-Path -LiteralPath $expected)) { throw 'Launcher mismatch or unexpected file creation' }
  reviewer-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/browser/*.cjs
      - run: python -m pip install "playwright>=1.49,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/review_flow.py
