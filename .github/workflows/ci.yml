name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    working-directory: issuepilot
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: issuepilot_test
          POSTGRES_USER: issuepilot
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U issuepilot -d issuepilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.6
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . ../demo.py && uv run ruff format --check . ../demo.py
      - run: uv run pytest -q
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://issuepilot:test-only-password@localhost:5432/issuepilot_test
          TEST_CHECKPOINT_URL: postgresql://issuepilot:test-only-password@localhost:5432/issuepilot_test
      - run: uv run python scripts/benchmark.py B1 --engine rules --out artifacts/benchmarks/b1
      - run: uv run python scripts/benchmark.py B2 --engine rules --out artifacts/benchmarks/b2
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-rules
          path: issuepilot/artifacts/benchmarks/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/init_env.py
      - run: docker compose -f compose.yaml -f compose.replay.yaml --profile automation --profile analytics config --quiet
      - run: docker compose build api && docker compose up -d --no-build --wait
      - run: curl --fail http://localhost:8000/health
      - name: Verify bundled Qwen tokenizer without loading the LLM
        run: docker compose exec -T worker python -c "from issuepilot.ai.client import _tokenizer; assert _tokenizer('models/qwen3-tokenizer.json').encode('test').ids"
      - name: Start the clean-checkout dataset stack and verify empty intake
        working-directory: .
        run: |
          python demo.py start
          python demo.py status > "$RUNNER_TEMP/issuepilot-replay-status.json"
          python -c "import json, os; from pathlib import Path; d=json.loads((Path(os.environ['RUNNER_TEMP'])/'issuepilot-replay-status.json').read_text()); assert d['expected']==1993 and d['received']==0"
          curl --fail http://localhost:8021/health
          curl --fail --retry 10 --retry-delay 2 --max-time 5 --retry-all-errors http://localhost:5698/healthz/readiness
      - name: Print replay diagnostics on failure
        if: failure()
        working-directory: .
        run: python demo.py logs
      - run: docker compose down
        if: always()
  ai-bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python bench.py doctor
      - run: python bench.py --dataset-config examples/local/profile.json check-data
      - run: python bench.py --dataset-config examples/local/profile.json classify --modes rules --out runs/ci-class
      - run: python bench.py --dataset-config examples/local/profile.json classify-report --out runs/ci-class
      - run: python bench.py --dataset-config examples/local/profile.json retrieval --modes bm25 --out runs/ci-retrieval
  reviewer-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/browser/*.cjs
      - run: python -m pip install "playwright>=1.49,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/review_flow.py
